<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fleche" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="flecheClaire" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>

  <!-- Clients -->
  <rect x="300" y="24" width="300" height="52" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Navigateur — React 19 + TypeScript</text>
  <text x="450" y="64" text-anchor="middle" font-size="11" fill="#555">agent · superviseur · administrateur · bénéficiaire</text>

  <line x1="450" y1="76" x2="450" y2="112" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fleche)"/>
  <text x="462" y="98" font-size="10" fill="#555">HTTPS / JSON</text>

  <!-- Django -->
  <rect x="150" y="112" width="600" height="128" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="450" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Django 5 + Django REST Framework</text>

  <rect x="172" y="150" width="172" height="72" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
  <text x="258" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">domaine</text>
  <text x="258" y="190" text-anchor="middle" font-size="10" fill="#555">moteur de calendrier</text>
  <text x="258" y="205" text-anchor="middle" font-size="10" fill="#555">Python pur, sans ORM</text>

  <rect x="364" y="150" width="172" height="72" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
  <text x="450" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">api</text>
  <text x="450" y="190" text-anchor="middle" font-size="10" fill="#555">sérialiseurs, vues,</text>
  <text x="450" y="205" text-anchor="middle" font-size="10" fill="#555">permissions par rôle</text>

  <rect x="556" y="150" width="172" height="72" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
  <text x="642" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">rappels</text>
  <text x="642" y="190" text-anchor="middle" font-size="10" fill="#555">composition wolof,</text>
  <text x="642" y="205" text-anchor="middle" font-size="10" fill="#555">abstraction des canaux</text>

  <!-- Stockage -->
  <line x1="300" y1="240" x2="300" y2="276" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fleche)"/>
  <line x1="600" y1="240" x2="600" y2="276" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fleche)"/>

  <rect x="180" y="276" width="240" height="52" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">PostgreSQL 16</text>
  <text x="300" y="315" text-anchor="middle" font-size="10" fill="#555">bénéficiaires, échéances, doses, audit</text>

  <rect x="480" y="276" width="240" height="52" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Redis</text>
  <text x="600" y="315" text-anchor="middle" font-size="10" fill="#555">courtier Celery et cache</text>

  <!-- Celery -->
  <line x1="600" y1="328" x2="600" y2="368" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fleche)"/>

  <rect x="420" y="368" width="360" height="56" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Celery + Celery Beat</text>
  <text x="600" y="408" text-anchor="middle" font-size="10" fill="#555">balayage quotidien · planification · envois · reprises</text>

  <!-- Sorties -->
  <line x1="510" y1="424" x2="510" y2="452" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="150" y1="452" x2="760" y2="452" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="150" y1="452" x2="150" y2="496" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fleche)"/>
  <line x1="380" y1="452" x2="380" y2="496" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fleche)"/>
  <line x1="570" y1="452" x2="570" y2="496" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fleche)"/>
  <line x1="760" y1="452" x2="760" y2="496" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fleche)"/>

  <rect x="40" y="496" width="220" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Service de synthèse</text>
  <text x="150" y="535" text-anchor="middle" font-size="10" fill="#555">Kiriku-Wolof-TTS (VITS)</text>
  <text x="150" y="550" text-anchor="middle" font-size="10" fill="#555">Python 3.11, séparé</text>
  <text x="150" y="562" text-anchor="middle" font-size="9" fill="#777" font-style="italic">repli : segments enregistrés</text>

  <rect x="290" y="496" width="180" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="380" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">WhatsApp</text>
  <text x="380" y="535" text-anchor="middle" font-size="10" fill="#555">Cloud API (Meta)</text>
  <text x="380" y="552" text-anchor="middle" font-size="9" fill="#777" font-style="italic">vocal encapsulé en vidéo</text>

  <rect x="490" y="496" width="160" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="570" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Passerelle SMS</text>
  <text x="570" y="538" text-anchor="middle" font-size="9" fill="#777" font-style="italic">repli si WhatsApp</text>
  <text x="570" y="551" text-anchor="middle" font-size="9" fill="#777" font-style="italic">échoue</text>

  <rect x="670" y="496" width="190" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="765" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Espace bénéficiaire</text>
  <text x="765" y="538" text-anchor="middle" font-size="9" fill="#777" font-style="italic">pour les mères ayant</text>
  <text x="765" y="551" text-anchor="middle" font-size="9" fill="#777" font-style="italic">refusé les deux canaux</text>

  <!-- Webhook -->
  <path d="M290,532 C200,600 300,615 420,600 L700,560" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#flecheClaire)"/>
  <text x="450" y="618" text-anchor="middle" font-size="10" fill="#777">accusés de réception (webhook) → statut des rappels</text>

  <!-- Légende -->
  <line x1="40" y1="600" x2="70" y2="600" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="78" y="604" font-size="10" fill="#555">service externe ou séparé</text>
</svg>