services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suvac}
      POSTGRES_USER: ${POSTGRES_USER:-suvac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suvac}
    ports:
      - "5432:5432"
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suvac}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  synthese:
    build: ./services/synthese
    volumes:
      - modele_synthese:/modele
      - audio_synthese:/audio
    ports:
      - "8800:8800"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/sante')"]
      interval: 30s
      timeout: 10s
      # Le modèle met plusieurs secondes à charger au démarrage.
      start_period: 90s

  # Service à usage unique : télécharge le modèle dans le volume.
  #   HF_TOKEN=hf_xxx docker compose run --rm synthese-modele
  synthese-modele:
    build: ./services/synthese
    volumes:
      - modele_synthese:/modele
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command: python telecharger_modele.py
    profiles: ["outils"]

volumes:
  donnees_postgres:
  modele_synthese:
  audio_synthese:
