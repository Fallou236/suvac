name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une PR mise à jour annule le run précédent : on ne paie pas
# deux fois pour un état de code périmé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — qualité et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: suvac_test
          POSTGRES_USER: suvac
          POSTGRES_PASSWORD: suvac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suvac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: cle-de-test-sans-valeur-mais-suffisamment-longue-pour-hmac-sha256
      DJANGO_DEBUG: "True"
      POSTGRES_DB: suvac_test
      POSTGRES_USER: suvac
      POSTGRES_PASSWORD: suvac
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Formatage — black
        run: black --check .

      - name: Style et erreurs — ruff
        run: ruff check .

      - name: Typage — mypy
        run: mypy apps config
        continue-on-error: true

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov-report=xml --cov-report=term-missing

      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — qualité et tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Typage — tsc
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run --passWithNoTests --coverage

      - name: Build de production
        run: npm run build

      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

      - name: Style et erreurs — oxlint
        run: npx oxlint

  securite:
    name: Sécurité des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit des dépendances Python
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit des dépendances Node
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
